name: Sync parking data

on:
  schedule:
    - cron: "0 18 * * *"   # every day at 18:00 UTC, about 4:30am in Adelaide
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r sync/requirements.txt
      - name: Run tests
        working-directory: sync
        run: python -m unittest -v
      - name: Pull data from the council
        working-directory: sync
        run: python sync_parking.py
      - name: Commit if anything changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add frontend/data
          if git diff --staged --quiet; then
            echo "No change in the data."
          else
            git commit -m "Update parking data"
            git push
          fi
