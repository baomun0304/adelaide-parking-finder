<!DOCTYPE html>
<html lang="en-AU">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Adelaide Parking Finder</title>
<meta name="description" content="Every on-street parking bay in the Adelaide CBD on one map: free, ticketed, unrestricted, motorcycle, disabled and loading zones, and what applies right now.">
<meta name="theme-color" content="#f3efe6" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#151513" media="(prefers-color-scheme: dark)">
<meta property="og:type" content="website">
<meta property="og:site_name" content="Adelaide Parking Finder">
<meta property="og:title" content="Adelaide Parking Finder">
<meta property="og:description" content="Every on-street bay in the Adelaide CBD, and what applies right now. Filter by how long you need and whether it's free.">
<meta property="og:url" content="https://adelaide-parking-finder.vercel.app/">
<meta property="og:image" content="https://adelaide-parking-finder.vercel.app/icons/og-image.png">
<meta property="og:image:width" content="1200">
<meta property="og:image:height" content="630">
<meta name="twitter:card" content="summary_large_image">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Parking">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect x='4' y='4' width='56' height='56' rx='10' fill='%23fff' stroke='%230f7a3d' stroke-width='5'/%3E%3Ctext x='32' y='46' font-family='Arial' font-weight='700' font-size='38' text-anchor='middle' fill='%230f7a3d'%3EP%3C/text%3E%3C/svg%3E">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<link rel="stylesheet" href="vendor/maplibre-gl.css">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Atkinson+Hyperlegible:wght@400;700&family=Overpass:wght@700;800;900&display=swap" rel="stylesheet">
<script defer src="/_vercel/insights/script.js"></script>
<link rel="stylesheet" href="style.css">
</head>
<body>
<h1 class="sr-only">Adelaide Parking Finder: on-street parking map for the city centre</h1>
<noscript><p class="noscript">This map needs JavaScript. Please turn it on, or check the signs on the street.</p></noscript>
<div id="map" aria-label="Map of parking bays"></div>

<header class="topbar">
  <div class="top-row">
    <div class="brand">
      <span class="brand-plate" aria-hidden="true">P</span>
      <span class="brand-text"><b>Adelaide</b> Parking Finder</span>
    </div>
    <form id="search-form" class="search" role="search" autocomplete="off">
      <input id="search-input" type="search" placeholder="Search a street or place" aria-label="Search for a street or place in the city" enterkeyhint="search" maxlength="80">
      <button type="submit" aria-label="Search">
        <svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="10.5" cy="10.5" r="6.5" fill="none"/><path d="m15.5 15.5 5 5" fill="none"/></svg>
      </button>
    </form>
  </div>
  <ul id="search-results" class="results" aria-label="Search results" hidden></ul>
  <div id="banner" class="banner" role="status" hidden></div>
</header>

<nav class="tools" aria-label="Map tools">
  <button id="locate-btn" class="tool" title="Show my location" aria-label="Show my location">
    <svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="3.2"/><circle cx="12" cy="12" r="7.5" fill="none"/><path d="M12 1.5v3M12 19.5v3M1.5 12h3M19.5 12h3" fill="none"/></svg>
  </button>
  <button id="follow-btn" class="tool" title="Follow me while driving" aria-label="Follow me" aria-pressed="false">
    <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 2.5 19.5 21 12 16.8 4.5 21z"/></svg>
  </button>
  <div class="tool-wrap">
    <button id="layers-btn" class="tool" title="Map style" aria-label="Map style: satellite, 3D, dark" aria-haspopup="true" aria-expanded="false" aria-controls="layers-menu">
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="m12 3-9 5 9 5 9-5z" fill="none"/><path d="m3 12.5 9 5 9-5" fill="none"/><path d="m3 17 9 5 9-5" fill="none"/></svg>
    </button>
    <div id="layers-menu" class="menu" role="menu" aria-label="Map style" hidden>
      <button type="button" role="menuitemradio" data-layer="map" aria-checked="true">Map</button>
      <button type="button" role="menuitemradio" data-layer="satellite" aria-checked="false">Satellite</button>
      <hr>
      <button type="button" role="menuitemcheckbox" data-layer="tilt" aria-pressed="false">3D buildings</button>
      <button type="button" role="menuitemcheckbox" data-layer="dark" aria-pressed="false">Dark mode</button>
    </div>
  </div>
  <button id="key-btn" class="tool" title="What the signs mean, and about the data" aria-label="What the signs mean, and about the data">
    <svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="9" fill="none"/><path d="M12 11v6" fill="none"/><circle cx="12" cy="7.6" r="1.1"/></svg>
  </button>
</nav>

<section id="panel" class="panel" aria-labelledby="panel-title">
  <h2 id="panel-title" class="panel-title">Find a park</h2>
  <div id="status" class="status" role="status" aria-live="polite"></div>
  <div class="panel-q">
    <span class="q-label" id="need-label">How long?</span>
    <div id="quick-need" class="opts quick" role="group" aria-labelledby="need-label"></div>
  </div>
  <div class="panel-row">
    <button type="button" class="opt" data-set="free" aria-pressed="false">Free only</button>
    <button type="button" id="when-btn" class="opt" aria-pressed="false" title="Parking later? Pick a day and time">Now</button>
    <button type="button" id="more-btn" class="opt" aria-expanded="false" aria-controls="more">More<span id="more-badge" class="badge" hidden></span></button>
    <button type="button" id="list-btn" class="opt list-opt">List</button>
  </div>
  <div id="more" class="more" hidden></div>
</section>

<section id="sheet" class="sheet" role="dialog" aria-labelledby="sheet-title" hidden>
  <div class="sheet-grip" aria-hidden="true"></div>
  <button class="sheet-close" aria-label="Close">&times;</button>
  <div id="sheet-body"></div>
</section>

<script src="vendor/maplibre-gl.js"></script>
<script src="logic.js"></script>
<script src="app.js"></script>
</body>
</html>
